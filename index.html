<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>todoLeast</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"/><script defer="defer" src="main.js"></script></head><body><nav class="sideBar"><div class="logo">todoleast</div><div class="createProjectInput"><input name="projectName" id="projectName" placeholder="Add a new project..."> <button class="createProjectButton">+</button></div><div class="projectsList"></div></nav><main class="content"></main><button id="createTodoButton">+</button><dialog id="createTodoDialog"><button class="closeButton">x</button><form><p><label for="titleOfTodo">The Title of your todo</label> <input id="titleOfTodo" name="titleOfTodo" value="todo" required></p><p><label for="descriptionOfTodo">The description of your todo</label> <textarea id="descriptionOfTodo" name="descriptionOfTodo"></textarea></p><p><label for="dueDateOfTodo">Due Date:</label> <input type="date" id="dueDateOfTodo" name="dueDateOfTodo"></p><p><label for="prioritySelectMenu">Priority:</label> <select name="prioritySelectMenu" id="prioritySelectMenu"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option><option value="none" selected="selected">none</option></select></p><p><label for="projectsSelectMenu">Project:</label> <select name="projectsSelectMenu" id="projectsSelectMenu" required oninvalid="this.setCustomValidity('Please, Create a project to continue')"></select></p><input type="submit" value="Create Your Todo"></form></dialog><dialog id="editTodoDialog"><button class="closeButton">x</button><form><p><label for="titleOfTodo">Edit The Title of your todo</label> <input id="titleOfTodo" name="titleOfTodo" required></p><p><label for="descriptionOfTodo">Edit The description of your todo</label> <textarea id="descriptionOfTodo" name="descriptionOfTodo"></textarea></p><p><label for="dueDateOfTodo">Due Date:</label> <input type="date" id="dueDateOfTodo" name="dueDateOfTodo"></p><p><label for="prioritySelectMenu">Priority:</label> <select name="prioritySelectMenu" id="prioritySelectMenu"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option><option value="none" selected="selected">none</option></select></p><input type="submit" value="Confirm"></form></dialog></body></html>
