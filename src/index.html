<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todoLeast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <nav class="sideBar">
        <div class="logo">
            todoleast
        </div>

        <div class="createProjectInput">
            <input type="text" name="projectName" id="projectName" placeholder="Add a new project...">
            <button class="createProjectButton">
                +
            </button>
        </div>
        <div class="projectsList">

        </div>

    </nav>
    <main class="content">
    </main>

    <button id="createTodoButton">+</button>
    <dialog id="TodoDialog">
        <form id="todoDialogForm">
            <div>
                <label for="titleOfTodo">The Title of your todo</label>
                <input type="text" id="titleOfTodo" name="titleOfTodo" value="myTodo" required>
            </div>
            <div>
                <label for="descriptionOfTodo">The description of your todo</label>
                <textarea id="descriptionOfTodo" name="descriptionOfTodo"></textarea>
            </div>
            <div>
                <label for="dueDateOfTodo">Due Date:</label>
                <input type="date" id="dueDateOfTodo" name="dueDateOfTodo">
            </div>
            <div>
                <label for="prioritySelectMenu">Priority:</label>
                <select name="prioritySelectMenu" id="prioritySelectMenu">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="none" selected>none</option>
                </select>
            </div>
            <div>
                <label for="projectsSelectMenu">Project:</label>
                <select name="projectsSelectMenu" id="projectsSelectMenu" required
                    oninvalid="this.setCustomValidity('Please, Create a project to continue')">
                </select>
            </div>
            
        </form>
        <div class="buttons">
            <input type="submit" value="Create Your Todo" form="todoDialogForm">
            <button class="closeButton">Cancel</button>
            </div>
    </dialog>
</body>

</html>
